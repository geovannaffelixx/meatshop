services:
  backend:
    deploy:
      replicas: ${SCALE_BACKEND_REPLICAS:-2}
    container_name: !reset null
    ports: !reset []
    environment:
      SOCKET_IO_SHARED: "true"
      BACKEND_REPLICAS: ${SCALE_BACKEND_REPLICAS:-2}
      TRUST_PROXY: "true"
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "3001:80"
    volumes:
      - ./nginx-scale.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
