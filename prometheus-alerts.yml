groups:
  - name: meatshop-api
    rules:
      - alert: MeatshopRefundRequiresAttention
        expr: max(payment_refund_queue{status="FAILED"}) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Estorno precisa de atendimento financeiro
      - alert: MeatshopRefundProcessingDelayed
        expr: max(payment_oldest_pending_refund_seconds) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Estorno pendente há mais de 15 minutos
      - alert: MeatshopPaymentMaintenanceStopped
        expr: time() - max(payment_maintenance_last_success_timestamp_seconds) > 180
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Manutenção de pagamentos parou de atualizar
      - alert: MeatshopBackendUnavailable
        expr: up{job="meatshop-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Backend MeatShop indisponível
      - alert: MeatshopHighErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Taxa de erros 5xx acima de 5%
      - alert: MeatshopHighP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket[5m])) by (le)) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Latência p95 acima de 500 ms
      - alert: MeatshopLoginFailuresSpike
        expr: sum(rate(http_requests_total{route=~"/auth/(login|mobile/password)",status_code=~"4.."}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Pico de falhas de login detectado
      - alert: MeatshopPaymentWebhookBacklog
        expr: max(payment_webhook_queue_pending) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Fila de webhooks de pagamento acumulada
          description: Mais de 50 webhooks do Mercado Pago pendentes há pelo menos 10 minutos.
      - alert: MeatshopPaymentWebhookFailures
        expr: sum(increase(payment_webhook_processing_failures_total[15m])) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Falhas no processamento de webhooks de pagamento
          description: Mais de 5 falhas de processamento de webhooks nos últimos 15 minutos.
      - alert: MeatshopRateLimitRejectionsSpike
        expr: sum by (scope) (rate(rate_limit_rejections_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Pico de requisições bloqueadas por rate limit
          description: "Escopo {{ $labels.scope }} rejeitando mais de 1 requisição por segundo."
      - alert: MeatshopHighCpuUsage
        expr: sum by (instance) (rate(process_cpu_seconds_total{job="meatshop-backend"}[5m])) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Uso de CPU do backend acima de 80%
          description: "Instância {{ $labels.instance }} consumindo mais de 0,8 núcleo por 10 minutos."
      - alert: MeatshopHighMemoryUsage
        expr: max by (instance) (process_resident_memory_bytes{job="meatshop-backend"}) > 400 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Uso de memória do backend acima de 400 MiB
          description: "Instância {{ $labels.instance }} com memória residente acima de 400 MiB por 10 minutos."
