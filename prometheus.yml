global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: "meatshop-backend"
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 3001

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
