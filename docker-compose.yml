name: meatshop

# Valores exclusivamente locais para o ambiente Docker de demonstração.
# Em produção, substitua credenciais e segredos por um gerenciador de secrets.
x-backend-environment: &backend-environment
  NODE_ENV: development
  PORT: "3001"
  SWAGGER_ENABLED: "true"
  TZ: America/Sao_Paulo

  DB_TYPE: postgres
  DB_HOST: db
  DB_PORT: "5432"
  DB_USERNAME: meatshop_user
  DB_PASSWORD: meatshop_pass
  DB_DATABASE: meatshop
  DB_SYNCHRONIZE: "false"
  DB_SSL: "false"

  JWT_SECRET: local-demo-access-secret-meatshop-2026-do-not-use-in-production
  JWT_REFRESH_SECRET: local-demo-refresh-secret-meatshop-2026-do-not-use-in-production
  JWT_EXPIRES_IN: 15m
  DELIVERY_CODE_SECRET: local-demo-delivery-code-secret-meatshop-2026
  DELIVERY_CODE_ENCRYPTION_KEY: local-demo-delivery-code-encryption-meatshop-2026
  PICKUP_CODE_TTL_MINUTES: "240"
  DELIVERY_CODE_TTL_HOURS: "72"
  DEFAULT_DELIVERY_FEE: "8.50"
  DELIVERY_FEE_BASE: "3.20"
  DELIVERY_FEE_PER_KM: "1.10"
  DELIVERY_FEE_LONG_DISTANCE_KM: "8"
  DELIVERY_FEE_LONG_DISTANCE_SURCHARGE: "2"
  DELIVERY_FEE_PEAK_MULTIPLIER: "1.3"

  FRONTEND_URL: http://localhost:3000
  CORS_ORIGINS: http://localhost:3000
  BACKEND_PUBLIC_URL: http://localhost:3001
  COOKIE_SECURE: "false"
  COOKIE_SAMESITE: strict
  BRASIL_API_BASE_URL: https://brasilapi.com.br/api

  SEED_ENABLED: "false"
  SEED_ADMIN_EMAIL: admin@meatshop.local
  SEED_PASSWORD: MeatshopDev123!

  LOG_LEVEL: info
  LOG_DIR: logs
  LOG_MAX_DAYS: 14d
  TYPEORM_LOGGING: "false"

  MAIL_HOST: ""
  MAIL_PORT: "2525"
  MAIL_SECURE: "false"
  MAIL_USER: ""
  MAIL_PASSWORD: ""
  MAIL_FROM: ""
  MP_ACCESS_TOKEN: ""
  MP_WEBHOOK_SECRET: ""
  MP_WEBHOOK_TOLERANCE_SECONDS: "300"
  MP_ENV: sandbox
  FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
  FIREBASE_APP_CHECK_ENFORCED: "false"
  FIREBASE_APP_CHECK_PROTECTED_PATHS: /auth/firebase-exchange
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "120"
  DELIVERY_TRACKING_RETENTION_DAYS: "30"
  TRUST_PROXY: "false"

services:
  db:
    image: postgres:17-alpine
    container_name: meatshop-postgres
    environment:
      POSTGRES_DB: meatshop
      POSTGRES_USER: meatshop_user
      POSTGRES_PASSWORD: meatshop_pass
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meatshop_user -d meatshop"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrator:
    image: meatshop-backend:dev
    container_name: meatshop-migrator
    command: ["npm", "run", "migration:run:prod"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./meatshop-backend
      dockerfile: Dockerfile
    image: meatshop-backend:dev
    container_name: meatshop-backend
    environment: *backend-environment
    depends_on:
      migrator:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    volumes:
      - backend_logs:/usr/src/app/logs
      - uploads:/usr/src/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./meatshop-main
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    image: meatshop-frontend:dev
    container_name: meatshop-frontend
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: America/Sao_Paulo
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:latest
    container_name: meatshop-prometheus
    profiles: ["observability"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:latest
    container_name: meatshop-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      TZ: America/Sao_Paulo
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  backend_logs:
  uploads:
  grafana_data:
