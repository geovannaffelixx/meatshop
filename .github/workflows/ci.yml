name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: meatshop
          POSTGRES_USER: meatshop_user
          POSTGRES_PASSWORD: meatshop_pass
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U meatshop_user -d meatshop"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      DB_TYPE: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: meatshop_user
      DB_PASSWORD: meatshop_pass
      DB_DATABASE: meatshop
      DB_SYNCHRONIZE: "false"
      DB_SSL: "false"
      JWT_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      DELIVERY_CODE_SECRET: ci-delivery-secret-with-at-least-32-characters
      DELIVERY_CODE_ENCRYPTION_KEY: ci-encryption-key-with-at-least-32-chars
      FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      FIREBASE_APP_CHECK_ENFORCED: "false"
      SEED_ENABLED: "false"
    defaults:
      run:
        working-directory: meatshop-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: meatshop-backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migration:run:prod
      - run: npm run test:coverage
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: meatshop-backend/coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meatshop-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: meatshop-main/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: meatshop-main/coverage

  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose up -d --build
      - name: Wait for services
        shell: bash
        run: |
          for attempt in {1..60}; do
            curl -fsS http://localhost:3001/health &&
              curl -fsS http://localhost:3000/login &&
              exit 0
            sleep 2
          done
          docker compose ps
          exit 1
      - run: node scripts/performance-smoke.mjs
      - name: Capture compose logs
        if: always()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-logs
          path: compose-logs.txt
      - if: always()
        run: docker compose down --volumes

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
